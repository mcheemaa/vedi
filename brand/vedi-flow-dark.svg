<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-label="Vedi's flow: any camera feeds the on-device Eye, which distills pixels into percepts and vectors for ClickHouse, the mind, and keyframes for Postgres, the vault. CDC mirrors the vault into the mind. Three markdown agents, Vedi, the dreamer, and the narrator, read the mind and write back traces, deep memory, and the day's story. Vedi speaks through a sentence-streamed voice, and one search space covers everything ever seen.">
  <style>
    .flow { stroke-dasharray: 5 7; animation: march 1.6s linear infinite; }
    .breathe { animation: breathe 2.6s ease-in-out infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .breathe { animation: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="#4d5566"/>
    </marker>
    <marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="#ff8a6a"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, 'SF Mono', Menlo, 'Cascadia Mono', monospace" fill="#e6edf3">

    <!-- any camera -->
    <rect x="28" y="206" width="152" height="72" fill="#0d0f12" stroke="#2a3038"/>
    <rect x="46" y="224" width="9" height="9" fill="#ff8a6a"/>
    <text x="64" y="233" font-size="14">any camera</text>
    <text x="46" y="258" font-size="10.5" fill="#7d8590" letter-spacing="1">IPHONE · MACBOOK</text>

    <!-- the eye -->
    <rect x="234" y="128" width="216" height="232" fill="#0d0f12" stroke="#2a3038"/>
    <text x="252" y="156" font-size="11" letter-spacing="2.5" fill="#7d8590">THE EYE · ON DEVICE</text>
    <g font-size="12.5">
      <rect x="252" y="172" width="180" height="30" fill="#161b22" stroke="#262b33"/>
      <text x="264" y="192">phash gate</text>
      <rect x="252" y="210" width="180" height="30" fill="#161b22" stroke="#262b33"/>
      <text x="264" y="230">clip on the ane · 5ms</text>
      <rect x="252" y="248" width="180" height="30" fill="#161b22" stroke="#262b33"/>
      <text x="264" y="268">settle gate · keyframes</text>
      <rect x="252" y="286" width="180" height="30" fill="#161b22" stroke="#262b33"/>
      <text x="264" y="306">fastvlm caption · ocr</text>
    </g>
    <text x="252" y="344" font-size="10.5" fill="#7d8590" letter-spacing="1">SWIFT · SILENCE IS FREE</text>

    <!-- clickhouse -->
    <rect x="530" y="56" width="252" height="216" fill="#0d0f12" stroke="#2a3038"/>
    <rect x="548" y="76" width="9" height="9" fill="#f2c744"/>
    <text x="566" y="85" font-size="11" letter-spacing="2.5" fill="#7d8590">CLICKHOUSE · THE MIND</text>
    <g font-size="11.5">
      <rect x="548" y="100" width="138" height="24" fill="#161b22" stroke="#262b33"/>
      <text x="558" y="116">percepts · vectors</text>
      <rect x="694" y="100" width="70" height="24" fill="#161b22" stroke="#262b33"/>
      <text x="704" y="116">regions</text>
      <rect x="548" y="132" width="100" height="24" fill="#161b22" stroke="#262b33"/>
      <text x="558" y="148">traces</text>
      <rect x="656" y="132" width="108" height="24" fill="#161b22" stroke="#262b33"/>
      <text x="666" y="148">facts · watches</text>
      <rect x="548" y="164" width="122" height="24" fill="#161b22" stroke="#262b33"/>
      <text x="558" y="180">deep · dreams</text>
      <rect x="678" y="164" width="86" height="24" fill="#161b22" stroke="#262b33"/>
      <text x="688" y="180">digests</text>
    </g>
    <text x="548" y="216" font-size="10.5" fill="#7d8590" letter-spacing="1">THE TRANSCRIPT IS A TABLE</text>
    <text x="548" y="234" font-size="10.5" fill="#7d8590" letter-spacing="1">COSINE OVER EVERY MOMENT</text>
    <text x="548" y="252" font-size="10.5" fill="#7d8590" letter-spacing="1">ANTI-JOIN AS WORK QUEUE</text>

    <!-- postgres -->
    <rect x="530" y="336" width="252" height="98" fill="#0d0f12" stroke="#2a3038"/>
    <rect x="548" y="356" width="9" height="9" fill="#5c93c4"/>
    <text x="566" y="365" font-size="11" letter-spacing="2.5" fill="#7d8590">POSTGRES · THE VAULT</text>
    <text x="548" y="392" font-size="12.5">every pixel · system of record</text>
    <text x="548" y="414" font-size="10.5" fill="#7d8590" letter-spacing="1">VERIFY-FULL · PINNED CA</text>

    <!-- the brain -->
    <rect x="852" y="96" width="200" height="230" fill="#0d0f12" stroke="#2a3038"/>
    <text x="870" y="124" font-size="11" letter-spacing="2.5" fill="#7d8590">THE BRAIN · BUN</text>
    <g font-size="12.5">
      <rect x="870" y="140" width="164" height="34" fill="#161b22" stroke="#3d2b26"/>
      <text x="882" y="161"><tspan fill="#ff8a6a">vedi</tspan> · luna · speaks</text>
      <rect x="870" y="182" width="164" height="34" fill="#161b22" stroke="#262b33"/>
      <text x="882" y="203">dreamer · studies</text>
      <rect x="870" y="224" width="164" height="34" fill="#161b22" stroke="#262b33"/>
      <text x="882" y="245">narrator · the day</text>
    </g>
    <text x="870" y="292" font-size="10.5" fill="#7d8590" letter-spacing="1">SPEAK · NOTE · IGNORE</text>
    <text x="870" y="310" font-size="10.5" fill="#7d8590" letter-spacing="1">SILENCE HAS A REASON</text>

    <!-- voice -->
    <rect x="852" y="370" width="200" height="64" fill="#0d0f12" stroke="#ff8a6a" class="breathe"/>
    <rect x="870" y="390" width="9" height="9" fill="#ff8a6a"/>
    <text x="888" y="399" font-size="12.5">voice · coral</text>
    <text x="870" y="420" font-size="10.5" fill="#7d8590" letter-spacing="1">STREAMED · REVOCABLE</text>

    <!-- search strip -->
    <rect x="28" y="454" width="1024" height="42" fill="#0d0f12" stroke="#2a3038"/>
    <text x="46" y="480" font-size="11.5" fill="#7d8590">search · words enter the same clip space as sight · <tspan fill="#e6edf3">months of memory, milliseconds</tspan></text>

    <!-- flows -->
    <g stroke="#4d5566" stroke-width="1.5" fill="none">
      <path d="M180 242 H 234" marker-end="url(#a)"/>
      <path class="flow" d="M450 200 L 530 150" marker-end="url(#a)"/>
      <path class="flow" d="M450 300 L 530 372" marker-end="url(#a)"/>
      <path class="flow" d="M656 336 V 272" marker-end="url(#a)"/>
      <path class="flow" d="M782 130 L 852 130" marker-end="url(#a)"/>
      <path d="M852 200 L 782 200" marker-end="url(#a)"/>
      <path d="M782 402 L 852 402" marker-end="url(#a)"/>
    </g>
    <g stroke="#ff8a6a" stroke-width="1.5" fill="none">
      <path class="flow" d="M952 326 V 370" marker-end="url(#ac)"/>
    </g>

    <!-- flow labels -->
    <g font-size="10.5" fill="#7d8590" letter-spacing="1">
      <text x="458" y="168">PERCEPTS</text>
      <text x="458" y="182">VECTORS</text>
      <text x="458" y="316">KEYFRAMES</text>
      <text x="458" y="330">JPEG</text>
      <text x="666" y="310">CDC</text>
      <text x="790" y="118">CONTEXT</text>
      <text x="790" y="222">ROWS BACK</text>
      <text x="794" y="390">LOOK</text>
      <text x="962" y="356">SPEAKS</text>
    </g>
  </g>
</svg>
